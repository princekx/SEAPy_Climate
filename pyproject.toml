[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seapy-climate"
version = "1.0.0"
description = "SEA and MJO climate diagnostics workflow (cold surges, equatorial waves, extreme precipitation, MJO propagation)."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "cartopy",
    "jinja2",
    "scitools-iris",
    "cf-units",
]

[project.optional-dependencies]
style = ["seaborn"]
assessment = ["netCDF4", "Pillow", "python-docx"]

[project.scripts]
seapy-climate = "main:main"

[tool.setuptools]
py-modules = ["main", "do_sea", "do_mjo"]
packages = ["src"]

[tool.setuptools.package-data]
src = ["*.dat", "*.rgb", "*.nc"]
